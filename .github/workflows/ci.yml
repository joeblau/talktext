name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: App, tests, and bundle (Intel)
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Export canonical bundle metadata
        run: ./scripts/export-canonical-metadata.sh

      - name: Verify pinned runner and toolchain
        run: |
          test "$(uname -m)" = "x86_64"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "15"
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 16.4"
          swift --version

      - name: Restore explicit SwiftPM and tool caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            TalkText/.build
            ~/.cache/talktext-tools
          key: talktext-v1-${{ runner.os }}-${{ runner.arch }}-xcode-16.4-${{ hashFiles('TalkText/Package.swift', 'TalkText/Package.resolved') }}
          restore-keys: |
            talktext-v1-${{ runner.os }}-${{ runner.arch }}-xcode-16.4-

      - name: Install digest-pinned lint tools
        run: |
          tool_bin="$(./scripts/install-ci-tools.sh)"
          echo "$tool_bin" >> "$GITHUB_PATH"

      - name: Validate shell, plist, version, lint, and format policy
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find . -type f -name '*.sh' -not -path './TalkText/.build/*' -print0)
          plutil -lint TalkText/Info.plist TalkText/TalkText.entitlements
          if /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' TalkText/Info.plist >/dev/null 2>&1; then
            echo 'TalkText/Info.plist must not duplicate VERSION' >&2
            exit 1
          fi
          ./scripts/read-version.sh
          swiftlint lint --strict --config .swiftlint.yml
          swiftformat --lint --config .swiftformat TalkText/Sources TalkText/Tests

      - name: Build debug and release for every supported architecture
        run: |
          for configuration in debug release; do
            for architecture in arm64 x86_64; do
              swift build \
                --package-path TalkText \
                --configuration "$configuration" \
                --triple "$architecture-apple-macosx$TALKTEXT_MINIMUM_SYSTEM_VERSION" \
                --scratch-path "TalkText/.build/$configuration-$architecture" \
                -Xswiftc -warnings-as-errors
            done
          done

      - name: Run all tests
        run: |
          swift test \
            --package-path TalkText \
            --configuration debug \
            --triple "x86_64-apple-macosx$TALKTEXT_MINIMUM_SYSTEM_VERSION" \
            --scratch-path TalkText/.build/tests-x86_64 \
            -Xswiftc -warnings-as-errors
          bash tests/dependency-tool-fixtures.sh

      - name: Assemble and verify extracted deterministic test bundle
        run: |
          fixture_dir="$RUNNER_TEMP/talktext-model-fixture"
          python3 tests/create-parakeet-fixture.py "$fixture_dir"
          export TALKTEXT_MODEL_MANIFEST="$fixture_dir/manifest.json"
          export TALKTEXT_MODEL_PATH="$fixture_dir/parakeet-tdt-0.6b-v2-coreml"
          TALKTEXT_SIGNING_MODE=adhoc ./bundle.sh
          archive="$RUNNER_TEMP/$TALKTEXT_BUNDLE_NAME-ci.zip"
          extracted="$RUNNER_TEMP/extracted"
          ditto -c -k --sequesterRsrc --keepParent "$TALKTEXT_BUNDLE_NAME.app" "$archive"
          mkdir -p "$extracted"
          ditto -x -k "$archive" "$extracted"
          TALKTEXT_EXPECTED_SIGNATURE=adhoc TALKTEXT_X86_64_SMOKE_TEST=1 \
            ./scripts/verify-bundle.sh "$extracted/$TALKTEXT_BUNDLE_NAME.app"

  backend-contract:
    name: Parakeet backend (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: macos-15-intel
          - architecture: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Export canonical bundle metadata
        run: ./scripts/export-canonical-metadata.sh

      - name: Verify native architecture and toolchain
        run: |
          test "$(uname -m)" = "${{ matrix.architecture }}"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "15"
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 16.4"
          swift --version

      - name: Restore reviewed Parakeet weights
        if: matrix.architecture == 'arm64'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: talktext-parakeet-v2-${{ hashFiles('TalkText/Sources/TalkText/Resources/parakeet-model.json') }}

      - name: Install and verify the pinned production model
        if: matrix.architecture == 'arm64'
        run: ./scripts/dependency-tool.sh install-model

      - name: Exercise Parakeet inference or unsupported-hardware preflight
        env:
          TALKTEXT_PARAKEET_SMOKE_TEST: '1'
          TALKTEXT_TEST_AUDIO: ${{ github.workspace }}/tests/fixtures/jfk.wav
        run: |
          swift test --package-path TalkText \
            --triple "${{ matrix.architecture }}-apple-macosx$TALKTEXT_MINIMUM_SYSTEM_VERSION" \
            --scratch-path TalkText/.build/parakeet-${{ matrix.architecture }} \
            --filter ParakeetIntegrationTests -Xswiftc -warnings-as-errors

  required:
    name: Required
    if: ${{ always() }}
    needs:
      - quality
      - backend-contract
    runs-on: ubuntu-24.04
    steps:
      - name: Require every macOS gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BACKEND_RESULT: ${{ needs.backend-contract.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$BACKEND_RESULT" = success
